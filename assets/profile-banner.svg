<!--
  File overview
  Purpose: Introduce Pietro on his GitHub profile with a repository-owned banner.
  Responsibilities: Render accessible, scalable artwork without external image services.
  Connections: Embedded by README.md through a relative asset path.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title description">
  <title id="title">Pietro Acampora — Computer Science student and software developer</title>
  <desc id="description">Dark blue banner with mint accents and connected modules representing application layers.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172b46"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <!-- Background and typography establish the profile's visual identity. -->
  <rect width="1200" height="280" rx="20" fill="url(#background)"/>
  <rect width="1200" height="280" rx="20" fill="url(#grid)"/>
  <rect x="48" y="52" width="4" height="176" rx="2" fill="#5eead4"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="76" y="81" fill="#5eead4" font-size="15" font-weight="600" letter-spacing="3">BUILDING THROUGH PRACTICE</text>
    <text x="74" y="145" fill="#f8fafc" font-size="52" font-weight="700" letter-spacing="-1">Pietro Acampora</text>
    <text x="76" y="184" fill="#cbd5e1" font-size="21">Computer Science student · Software Developer</text>
    <text x="76" y="219" fill="#94a3b8" font-size="17">Full-stack applications · Data integrity · Desktop software</text>
  </g>
  <!-- Connected modules echo the frontend, service and database layers. -->
  <g fill="none" stroke="#5eead4" stroke-width="2">
    <path d="M954 88L1052 140L954 192L856 140Z" stroke-opacity="0.55"/>
    <path d="M954 88V192M856 140H1052" stroke-opacity="0.2"/>
    <rect x="930" y="64" width="48" height="48" rx="12" fill="#152d3c"/>
    <rect x="1028" y="116" width="48" height="48" rx="12" fill="#152d3c"/>
    <rect x="930" y="168" width="48" height="48" rx="12" fill="#152d3c"/>
    <rect x="832" y="116" width="48" height="48" rx="12" fill="#152d3c"/>
  </g>
</svg>
